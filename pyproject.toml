[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "Governed agentic SDLC orchestrator — turns a requirement into a reviewed, tested, released service"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
sdlc = "sdlc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdlc*"]

[tool.setuptools.package-data]
sdlc = ["agents/prompts/*.md", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["runs", ".sdlc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S608", "UP042"]  # str-enums serialise as plain JSON strings
